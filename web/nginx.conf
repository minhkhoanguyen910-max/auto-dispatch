server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS. Looking "api" up per request (not once at startup) keeps the proxy
    # working after the api container restarts and gets a new IP.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:8000;

    # Traccar posts positions to the API over the internal network; never expose it publicly
    location /api/traccar/ {
        return 404;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in asset filenames, so they can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React Router handles every other path
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
